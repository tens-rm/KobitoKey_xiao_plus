description: Coalesce rapid relative mouse reports into one timed report

compatible: "kobitokey,input-processor-mouse-batch"

properties:
  "#input-processor-cells":
    type: int
    required: true
  track-remainders:
    type: boolean
    description: |
      Set on this processor node as required by ZMK's input listener.

input-processor-cells:
  - interval_ms
