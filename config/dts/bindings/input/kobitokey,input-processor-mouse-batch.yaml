description: Coalesce rapid relative mouse reports into one timed report

compatible: "kobitokey,input-processor-mouse-batch"

properties:
  "#input-processor-cells":
    type: int
    required: true
  track-remainders:
    type: boolean
    default: false
    description: |
      This processor does not need fractional input remainders.

input-processor-cells:
  - interval_ms
